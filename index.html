<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stargazer Lily Bouquet</title>
<style>
  /* ---- 1. COLORS: change these to recolor everything ---- */
  :root {
    --pink:      #ec4b8b;  /* petals */
    --pink-soft: #f9b8d0;  /* inner petals */
    --pink-deep: #c2185b;  /* speckles, stamens, ribbon */
    --leaf:      #4f8a5b;  /* leaves */
    --stem:      #356b42;  /* stems */
    --paper:     #f6efe6;  /* wrapping */
    --ink:       #3a2b33;  /* text */
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    font-family: Georgia, serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fdf7f3, #f7eef4);
  }

  .card {
    width: min(560px, 100%);
    background: #fffdfb;
    border-radius: 28px;
    padding: 2rem 1.5rem;
    text-align: center;
    box-shadow: 0 18px 40px -18px rgba(58, 43, 51, .28);
  }

  .eyebrow {
    margin: 0 0 .5rem;
    font: 600 .72rem system-ui, sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--pink-deep);
  }

  h1 { margin: 0 0 .5rem; font-weight: 400; font-size: clamp(1.6rem, 5vw, 2.1rem); }

  .sub { margin: 0 auto 1rem; max-width: 34ch; font-size: .95rem; color: #6d5b64; }

  /* ---- 2. THE DRAWING ---- */
  svg { width: 100%; height: auto; display: block; }

  .petal  { fill: var(--pink); }
  .petal2 { fill: var(--pink-soft); }
  .speck  { fill: var(--pink-deep); opacity: .55; }
  .stamen { stroke: var(--pink-deep); stroke-width: 1.6; fill: none; }
  .anther { fill: #b26a2f; }
  .leaf   { fill: var(--leaf); }
  .stem   { stroke: var(--stem); stroke-width: 4; fill: none; stroke-linecap: round; }
  .wrap   { fill: var(--paper); stroke: #e3d7c7; stroke-width: 2; }
  .fold   { stroke: #e3d7c7; stroke-width: 2; fill: none; }
  .ribbon { fill: var(--pink-deep); }

  /* ---- 3. SWAY: change 1.6deg for more/less, 6s for speed ---- */
  .bloom {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: sway 6s ease-in-out infinite;
  }
  .bloom:nth-child(2n) { animation-delay: -1.5s; }
  .bloom:nth-child(3n) { animation-delay: -3s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.6deg); }
  }

  @media (prefers-reduced-motion: reduce) { .bloom { animation: none; } }
</style>
</head>
<body>

<main class="card">
  <h1>Wishing you better days not just today but everyday!</h1>
  <h2>you are beautiful inside and out <3 </h2>

  <svg viewBox="0 0 400 420" role="img"
       aria-label="A bouquet of pink stargazer lilies wrapped in blush paper">

    <!-- ===== FLOWER TEMPLATE (edit once, all flowers change) ===== -->
    <defs>
      <g id="lily">
        <!-- 6 petals: rx = width, ry = length -->
        <g class="petal">
          <ellipse cx="0" cy="-34" rx="15" ry="34"/>
          <ellipse cx="0" cy="-34" rx="15" ry="34" transform="rotate(60)"/>
          <ellipse cx="0" cy="-34" rx="15" ry="34" transform="rotate(120)"/>
          <ellipse cx="0" cy="-34" rx="15" ry="34" transform="rotate(180)"/>
          <ellipse cx="0" cy="-34" rx="15" ry="34" transform="rotate(240)"/>
          <ellipse cx="0" cy="-34" rx="15" ry="34" transform="rotate(300)"/>
        </g>
        <!-- lighter inner petals -->
        <g class="petal2" opacity=".55">
          <ellipse cx="0" cy="-30" rx="8" ry="26" transform="rotate(30)"/>
          <ellipse cx="0" cy="-30" rx="8" ry="26" transform="rotate(90)"/>
          <ellipse cx="0" cy="-30" rx="8" ry="26" transform="rotate(150)"/>
          <ellipse cx="0" cy="-30" rx="8" ry="26" transform="rotate(210)"/>
          <ellipse cx="0" cy="-30" rx="8" ry="26" transform="rotate(270)"/>
          <ellipse cx="0" cy="-30" rx="8" ry="26" transform="rotate(330)"/>
        </g>
        <!-- speckles -->
        <g class="speck">
          <circle cx="-6" cy="-26" r="1.6"/><circle cx="4" cy="-30" r="1.3"/>
          <circle cx="-2" cy="-38" r="1.5"/><circle cx="8" cy="-20" r="1.2"/>
          <circle cx="-9" cy="-16" r="1.2"/><circle cx="1" cy="-14" r="1.1"/>
        </g>
        <!-- stamens + anthers -->
        <g class="stamen">
          <path d="M0 0 L-7 -16"/><path d="M0 0 L0 -19"/><path d="M0 0 L7 -16"/>
        </g>
        <g class="anther">
          <ellipse cx="-7" cy="-17" rx="3" ry="2"/>
          <ellipse cx="0" cy="-20" rx="3" ry="2"/>
          <ellipse cx="7" cy="-17" rx="3" ry="2"/>
        </g>
      </g>

      <!-- closed bud -->
      <g id="bud">
        <path class="petal2" d="M0 0 C-9 -14 -8 -34 0 -46 C8 -34 9 -14 0 0 Z"/>
        <path class="petal" d="M0 0 C-4 -12 -3 -30 0 -42 C3 -30 4 -12 0 0 Z" opacity=".75"/>
      </g>
    </defs>

    <!-- ===== STEMS: all start at the tie point (200,300) ===== -->
    <g class="stem">
      <path d="M200 300 C196 260 180 230 168 196"/>
      <path d="M200 300 C204 258 222 232 236 200"/>
      <path d="M200 300 C194 250 160 226 138 210"/>
      <path d="M200 300 C206 252 244 228 266 214"/>
      <path d="M200 300 C200 250 200 210 200 168"/>
      <path d="M200 300 C198 244 176 196 164 150"/>
      <path d="M200 300 C202 246 226 198 240 156"/>
    </g>

    <!-- ===== LEAVES ===== -->
    <g class="leaf">
      <path d="M186 268 C150 258 120 236 104 200 C142 208 174 232 190 262 Z"/>
      <path d="M214 264 C250 254 280 230 296 196 C258 204 226 230 210 258 Z"/>
      <path d="M196 232 C168 216 150 190 146 160 C176 176 192 202 198 228 Z"/>
      <path d="M206 230 C234 214 252 188 256 158 C226 174 210 200 204 226 Z"/>
    </g>

    <!-- ===== FLOWERS: x, y = position | scale = size | rotate = tilt ===== -->
    <g class="bloom"><use href="#lily" x="164" y="150" transform="rotate(-12 164 150)"/></g>
    <g class="bloom"><use href="#lily" x="240" y="156" transform="rotate(14 240 156)"/></g>
    <g class="bloom"><use href="#lily" x="200" y="168" transform="rotate(3 200 168)"/></g>
    <g class="bloom"><use href="#lily" x="138" y="210" transform="translate(138 210) scale(.86) translate(-138 -210) rotate(-22 138 210)"/></g>
    <g class="bloom"><use href="#lily" x="266" y="214" transform="translate(266 214) scale(.86) translate(-266 -214) rotate(20 266 214)"/></g>
    <g class="bloom"><use href="#bud"  x="168" y="196" transform="rotate(-26 168 196)"/></g>
    <g class="bloom"><use href="#bud"  x="236" y="200" transform="rotate(24 236 200)"/></g>

    <!-- ===== WRAPPING PAPER ===== -->
    <path class="wrap" d="M148 268 L252 268 L300 396 L100 396 Z"/>
    <g class="fold">
      <path d="M148 268 L200 300 L252 268"/>
      <path d="M200 300 L200 396"/>
      <path d="M176 268 L152 396"/>
      <path d="M224 268 L248 396"/>
    </g>

    <!-- ===== RIBBON ===== -->
    <rect class="ribbon" x="150" y="318" width="100" height="14" rx="7"/>
    <path class="ribbon" d="M200 325 C176 306 152 310 152 325 C152 340 176 344 200 325 Z"/>
    <path class="ribbon" d="M200 325 C224 306 248 310 248 325 C248 340 224 344 200 325 Z"/>
    <circle class="ribbon" cx="200" cy="325" r="7"/>
  </svg>
</main>

</body>
</html>
